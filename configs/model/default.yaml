# ── GNN architecture ──
hidden_dim: 96
dropout: 0.1
lag_steps: 2
activation: elu         

# ── Prediction model selector ──
selected_model: xgb    # mlp | rf | xgb

# ── MLP (sklearn MLPClassifier) ──
mlp:
  layers: [32, 32]
  activation: relu
  alpha: 1.0e-4
  learning_rate_init: 1.0e-3
  max_iter: 150

# ── Random Forest (sklearn RandomForestClassifier) ──
rf:
  n_estimators: 300
  max_depth: 5
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: sqrt
  n_jobs: -1

# ── XGBoost (xgboost.XGBClassifier) ──
xgb:
  n_estimators: 600
  learning_rate: 0.05
  max_depth: 4
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  min_child_weight: 5.0
  gamma: 0.0
  reg_alpha: 0.0
